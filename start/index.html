<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163e2d">
  <title>FLATPACEを開く</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f6ef;--ink:#172d22;--muted:#53685c;--line:#d8dfd4;--panel:#fff;--button:#174734;--label:#fff}
    @media(prefers-color-scheme:dark){:root{--bg:#111915;--ink:#f3f6eb;--muted:#afbeb0;--line:#36453b;--panel:#19231c;--button:#c7f17e;--label:#183225}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,sans-serif}
    main{max-width:34rem;margin:0 auto;padding:2rem 1.2rem}header{font-weight:900;letter-spacing:-.04em;font-size:1.55rem}
    h1{font-size:1.7rem;margin:1.7rem 0 1rem}h2{font-size:1.12rem;margin:0}p{margin:.55rem 0;color:var(--muted)}
    section{margin:1rem 0;padding:1.25rem;border:1px solid var(--line);border-radius:1rem;background:var(--panel)}
    a{display:block;padding:.7rem 1rem;margin-top:.9rem;border-radius:.7rem;background:var(--button);color:var(--label);text-align:center;font-weight:700;text-decoration:none}
    a.secondary{border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  </style>
</head>
<body>
  <main>
    <header>FLATPACE</header>
    <h1>スマホで歩行計測を始める</h1>
    <section><h2>誰でも使えるWeb版</h2>
      <p>ログイン・インストール不要。歩いた距離と時間を計測し、履歴をこのブラウザに保存します。</p>
      <p>Androidの対応ブラウザでは振動も使えます。iPhoneのSafariではペースの合図を画面に表示します。</p>
      <a href="../">Web版を開く</a>
    </section>
    <section><h2>iPhoneの振動テスト</h2>
      <p>Expo Goをインストール済みで、FLATPACEのExpoプロジェクトにアクセス権がある人向けです。「設定」で振動の強さを「強」にして試せます。</p>
      <a class="secondary" href="exp://u.expo.dev/d760bd2c-d215-41ae-98d0-69a2511d9275/branch/01a1a546-d83e-722f-8eea-ab42cb971b5b">テスト版をExpo Goで開く</a>
    </section>
  </main>
</body>
</html>
